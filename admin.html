<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moderation — LitReview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand"><img src="/static/vendor/img/ai-litreview-logo.svg" alt="AI LitReview" class="brand-logo"></a>
  <div class="nav-links">
    <a href="/browse.html">Browse</a>
    <a href="/submit.html">Submit</a>
    <a href="/review-process.html">Review process</a>
    <a href="/about.html">About</a>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>
  </div>
</nav>

<main class="container">
  <div class="admin-bar">
    <h1 class="page-title" style="margin:0">Moderation queue</h1>
    <div style="display:flex; gap:.75rem; align-items:center">
      <input type="password" id="token" class="token-input" placeholder="Admin token" autocomplete="off">
      <button class="btn btn-primary btn-sm" onclick="loadSubs()">Load</button>
    </div>
  </div>
  <p class="count-line" id="count"></p>
  <div id="queue"><p class="empty">Enter the admin token and press Load.</p></div>
</main>

<footer class="footer">
  AI LitReview © 2026 · Moderation interface
</footer>

<script src="/static/js/common.js"></script>
<script>
let TOKEN = '';
function getToken() { return document.getElementById('token').value.trim(); }
function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Admin-Token': myToken() }, opts.headers || {});
  return fetch(path, opts);
}
function myToken() { return sessionStorage.getItem('litreview_admin_token') || ''; }

function loadSubs() {
  const t = getToken();
  if (!t) { showErr('Enter the admin token.'); return; }
  sessionStorage.setItem('litreview_admin_token', t);
  document.getElementById('token').value = '';
  refresh();
}

function refresh() {
  const box = document.getElementById('queue');
  api('/api/v1/admin/submissions').then(function (r) {
    if (r.status === 401) { box.innerHTML = '<p class="empty">Invalid admin token.</p>'; return; }
    return r.json().then(function (j) { render(j.submissions || []); });
  }).catch(function () {
    box.innerHTML = '<p class="empty">Could not reach the moderation API.</p>';
  });
}

function showErr(msg) {
  const box = document.getElementById('queue');
  box.innerHTML = '<p class="empty">' + escapeHtml(msg) + '</p>';
}

function render(subs) {
  const box = document.getElementById('queue');
  const count = document.getElementById('count');
  const pending = subs.filter(function (s) { return s.status === 'pending'; });
  count.textContent = pending.length + ' pending · ' + (subs.length - pending.length) + ' processed';
  box.innerHTML = '';
  if (!pending.length) {
    box.innerHTML = '<p class="empty">No pending submissions. All caught up 👍</p>';
    return;
  }
  pending.forEach(function (s) {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.innerHTML =
      '<div class="head">' +
        '<div><div class="meta-sm">' + escapeHtml(s.sid) + ' · ' + escapeHtml(s.received_at ? s.received_at.replace('T',' ').slice(0,16) : '') + ' · ' + escapeHtml(s.area) + ' · ' + escapeHtml(s.format || 'markdown').toUpperCase() + '</div>' +
        '<div class="title" style="font-weight:600;font-size:1.05rem;margin-top:.25rem">' + escapeHtml(s.title) + '</div>' +
        '<div class="muted small">' + escapeHtml((s.authors || []).join(', ')) + '</div>' +
        (s.submitted_by && s.submitted_by.login ? '<div class="small" style="margin-top:.25rem">✍️ submitted by <strong>' + escapeHtml(s.submitted_by.login.split(':').pop()) + '</strong>' + (s.submitted_by.name ? ' (' + escapeHtml(s.submitted_by.name) + ')' : '') + ' <span class="faint">' + escapeHtml(s.submitted_by.provider || 'github') + ' verified</span></div>' : '') +
        '<div class="muted small">' + escapeHtml(s.contact_name) + ' &lt;' + escapeHtml(s.contact_email) + '&gt;</div>' +
        '</div>' +
        '<span class="pill pill-pending">pending</span>' +
      '</div>' +
      '<p class="small muted" style="margin-top:.75rem">' + escapeHtml((s.abstract || '').slice(0, 400)) + (s.abstract && s.abstract.length > 400 ? '…' : '') + '</p>' +
      (s.keywords && s.keywords.length ? '<div class="small" style="margin-top:.5rem">' + s.keywords.map(function (k) { return '<span class="tag">' + escapeHtml(k) + '</span>'; }).join(' ') + '</div>' : '') +
      '<details class="sub-details"><summary>Show full content (' + ((s.content_len) || '') + ' chars)</summary><div class="sub-body"></div></details>' +
      '<div class="scr-box" id="scr-' + s.sid + '">' + (s.screening ? renderScreening(s.screening) : '<p class="empty">Screening …</p>') + '</div>' +
      '<div class="sub-actions">' +
        '<button class="btn btn-sm" onclick="recompute(\'' + s.sid + '\',this)">↻ Re-run screening</button>' +
        '<button class="btn btn-primary btn-sm" onclick="action(\'' + s.sid + '\',\'approve\',this)">✓ Approve & publish</button>' +
        '<button class="btn btn-danger btn-sm" onclick="action(\'' + s.sid + '\',\'reject\',this)">✕ Reject</button>' +
      '</div>';
    box.appendChild(card);
    const details = card.querySelector('details');
    const body = card.querySelector('.sub-body');
    details.addEventListener('toggle', function () {
      if (details.open && !body.dataset.loaded) {
        body.dataset.loaded = '1';
        fetch('/api/v1/admin/content/' + encodeURIComponent(s.sid), { headers: { 'X-Admin-Token': myToken() } })
          .then(function (r) { return r.text(); })
          .then(function (t) { body.textContent = t; });
      }
    });
  });
}

function renderScreening(s) {
  const verdict = s.verdict || 'review';
  const color = verdict === 'ok' ? 'var(--ok,#2e7d32)' : verdict === 'review' ? 'var(--warn,#c77700)' : 'var(--danger,#c62828)';
  const label = verdict === 'ok' ? 'OK' : verdict === 'review' ? 'REVIEW' : 'BLOCKED';
  const flags = s.flags || [];
  const sec = s.security || {};
  const sq = s.soft_quality || {};
  const sc = s.score || {};
  const ii = sc.impact_index || {};
  const rows = '';
  let html = '<div class="scr-head"><strong style="color:' + color + '">' + label + '</strong>' +
    ' <span class="small muted">' +
    (sec.verdict ? 'security: ' + sec.verdict : '') +
    (sq.verdict ? ' · soft: ' + sq.verdict : '') +
    (sc.model ? ' · model: ' + sc.model : '') +
    '</span></div>';
  if (sc.status === 'degraded') html += '<p class="empty">LLM unavailable — heuristic screening only.</p>';
  if (ii.score) html += '<div class="scr-scores"><span class="scr-score">impact <strong>' + ii.score + '</strong>/10</span>' +
    '<span class="small muted">conf ' + (ii.confidence || '') + '</span>';
  const s5 = sc.scores || {};
  html += (s5.originality ? ' <span class="tag">orig ' + s5.originality + '</span>' : '') +
    (s5.methodological_rigor ? ' <span class="tag">rigor ' + s5.methodological_rigor + '</span>' : '') +
    (s5.clarity ? ' <span class="tag">clarity ' + s5.clarity + '</span>' : '') +
    (s5.relevance ? ' <span class="tag">relev ' + s5.relevance + '</span>' : '') +
    (s5.bibliography ? ' <span class="tag">biblio ' + s5.bibliography + '</span>' : '') +
    '</div>';
  if (sc.one_line) html += '<p class="small muted">' + escapeHtml(sc.one_line) + '</p>';
  const rf = sc.red_flags || [];
  if (rf.length) html += '<div class="small"><strong>red flags:</strong> ' + rf.map(function (f) { return '<span class="tag tag-warn">' + escapeHtml(f) + '</span>'; }).join(' ') + '</div>';
  if ((sec.flags || []).length) html += '<div class="small"><strong>security:</strong> ' + sec.flags.map(function (f) { return '<span class="tag tag-danger">' + escapeHtml(f) + '</span>'; }).join(' ') + '</div>';
  if ((sq.flags || []).length) html += '<div class="small"><strong>soft:</strong> ' + sq.flags.map(function (f) { return '<span class="tag tag-warn">' + escapeHtml(f) + '</span>'; }).join(' ') + '</div>';
  return html;
}

function recompute(sid, btn) {
  btn.disabled = true; btn.textContent = 'Running…';
  api('/api/v1/admin/screening/' + encodeURIComponent(sid), { method: 'POST' })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (res.ok) { renderScreening(res.j.screening); }
      refresh();
    })
    .catch(function () { alert('Network error'); btn.disabled = false; });
}

function action(sid, kind, btn) {
  if (kind === 'reject' && !confirm('Reject this submission? This cannot be undone.')) return;
  btn.disabled = true;
  api('/api/v1/admin/' + kind + '/' + encodeURIComponent(sid), { method: 'POST' })
    .then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    })
    .then(function (res) {
      if (res.ok) {
        if (kind === 'approve') {
          alert('Published as ' + res.j.id + ' → ' + res.j.url);
        }
        refresh();
      } else {
        alert('Error: ' + (typeof res.j.detail === 'string' ? res.j.detail : 'request failed'));
        btn.disabled = false;
      }
    })
    .catch(function () { alert('Network error'); btn.disabled = false; });
}
</script>
</body>
</html>
