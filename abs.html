<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LitReview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand"><span>Lit</span>Review</a>
  <div class="nav-links">
    <a href="/browse.html">Browse</a>
    <a href="/submit.html">Submit</a>
    <a href="/about.html">About</a>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>
  </div>
</nav>

<main id="content" class="container narrow">
  <p class="empty">Loading…</p>
</main>

<footer class="footer">
  LitReview © 2026 · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · Citable literature reviews, written by scientists with AI assistance
</footer>

<script src="/static/js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
loadData().then(function (data) {
  const r = data.reviews.find(function (x) { return x.id === id; });
  if (!r || r.status === 'hidden') { document.getElementById('content').innerHTML = '<p class="empty">Review not found.</p>'; return; }
  const area = data.areas.find(function (a) { return a.id === r.area; });
  document.title = '[' + r.id + '] ' + r.title;
  const main = document.getElementById('content');
  const formats = [];
  if (r.status === 'published') {
    formats.push('<a href="/papers/' + r.id + '/index.html">🌐 HTML</a>');
    const fmt = r.format || 'markdown';
    if (fmt === 'latex') {
      formats.push('<a href="/papers/' + r.id + '/main.pdf">📄 PDF</a>');
      formats.push('<a href="/papers/' + r.id + '/main.tex">📜 LaTeX</a>');
    } else {
      formats.push('<a href="/papers/' + r.id + '/main.md">📝 Markdown</a>');
    }
  }
  main.innerHTML =
    '<p class="meta-sm"><a href="/browse.html">&larr; All reviews</a></p>' +
    '<div class="area-badge">' + escapeHtml(area ? area.name : r.area) + '</div>' +
    '<h1 class="page-title">' + escapeHtml(r.title) + '</h1>' +
    '<p class="muted">' + escapeHtml(r.authors.join(', ')) + '</p>' +
    '<p class="meta-sm">' + escapeHtml(r.id) + ' · Published ' + escapeHtml(r.date) + '</p>' +
    (r.impact_index && r.impact_index.score ? '<p class="meta-sm">⭐ Impact index: <strong>' + escapeHtml(String(r.impact_index.score)) + '</strong>/10 <span class="faint">(confidence ' + escapeHtml(String(r.impact_index.confidence || '')) + ' · model: ' + escapeHtml(r.score_model || '') + ')</span> — AI-predicted citation impact, advisory only</p>' : '') +
    (r.ai_assist ? '<p class="meta-sm">AI assistance: <strong>' + escapeHtml(r.ai_assist) + '</strong> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p>' : '<p class="meta-sm">AI assistance: none declared · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p>') +
    (formats.length ? '<aside class="card" style="cursor:default;margin:1.5rem 0"><div class="small" style="font-weight:600;margin-bottom:.5rem">Access formats:</div><div class="small">' + formats.join(' <span class="faint">·</span> ') + '</div></aside>' : '') +
    '<h2 class="section-title" style="font-size:1.25rem;margin:1.5rem 0 .5rem">Abstract</h2>' +
    '<p class="prose">' + escapeHtml(r.abstract) + '</p>' +
    (r.keywords && r.keywords.length ?
      '<h2 class="section-title" style="font-size:1.25rem;margin:1.5rem 0 .5rem">Keywords</h2>' +
      '<div class="small">' + r.keywords.map(function (k) { return '<span class="tag">' + escapeHtml(k) + '</span>'; }).join(' ') + '</div>' : '');
}).catch(function () {
  document.getElementById('content').innerHTML = '<p class="empty">Could not load review.</p>';
});
</script>
</body>
</html>
