<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LitReview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.tailwindcss.com" rel="stylesheet">
<script>
function applyTheme(){const d=localStorage.theme==='dark'||(!('theme'in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);}
applyTheme();
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.theme=document.documentElement.classList.contains('dark')?'dark':'light';}
</script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#0a0a0a] dark:text-gray-100 min-h-screen flex flex-col">

<nav class="flex justify-between items-center px-8 py-4 bg-white dark:bg-[#141414] border-b border-gray-200 dark:border-gray-800">
  <a href="/" class="font-bold text-xl"><span style="color:var(--primary)">Lit</span>Review</a>
  <div class="flex gap-6 items-center text-sm">
    <a href="/browse.html" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">Browse</a>
    <a href="/about.html" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">About</a>
    <button onclick="toggleTheme()" class="px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-800 hover:scale-110 transition-transform">🌓</button>
  </div>
</nav>

<main id="content" class="flex-1 w-full max-w-3xl mx-auto px-8 py-12">
  <p class="text-gray-400">Loading…</p>
</main>

<footer class="px-8 py-8 text-center text-sm text-gray-500 border-t border-gray-200 dark:border-gray-800">
  LitReview © 2026 · AI-generated content is provided with curation but without warranty
</footer>

<script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
fetch('/data/reviews.json').then(r=>r.json()).then(data=>{
  const r=data.reviews.find(x=>x.id===id)||data.reviews[0];
  const area=data.areas.find(a=>a.id===r.area);
  document.title=`[${r.id}] ${r.title}`;
  const main=document.getElementById('content');
  main.innerHTML=`
  <div class="text-xs text-gray-400 mb-4">
    <a href="/browse.html" class="hover:underline">← All reviews</a>
  </div>
  <div class="mb-2 text-sm font-semibold" style="color:var(--primary)">${area?area.name:r.area}</div>
  <h1 class="text-3xl font-bold leading-tight">${r.title}</h1>
  <p class="mt-3 text-gray-500 dark:text-gray-400">${r.authors.join(', ')}</p>
  <p class="mt-1 text-sm text-gray-400 font-mono">${r.id} · Submitted ${r.date} · ${r.ai_model}</p>

  <aside class="my-6 p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#141414] text-sm">
    <div class="font-semibold mb-2">Access formats:</div>
    <div class="flex flex-wrap gap-x-6 gap-y-1">
      <a href="/papers/${r.id}/main.pdf" class="hover:underline" style="color:var(--primary)">📄 PDF</a>
      <a href="/papers/${r.id}/index.html" class="hover:underline" style="color:var(--primary)">🌐 HTML (experimental)</a>
      <a href="/papers/${r.id}/main.tex" class="hover:underline" style="color:var(--primary)">📝 LaTeX source</a>
    </div>
  </aside>

  <h2 class="font-bold mt-8 mb-2">Abstract</h2>
  <p class="leading-relaxed text-gray-700 dark:text-gray-300">${r.abstract}</p>

  <h2 class="font-bold mt-8 mb-2">Keywords</h2>
  <div class="flex flex-wrap gap-2">${(r.keywords||[]).map(k=>`<span class="px-3 py-1 rounded-full text-xs bg-gray-100 dark:bg-gray-800">${k}</span>`).join('')}</div>

  <div class="mt-10 p-4 text-xs text-gray-400 rounded-lg border border-dashed border-gray-300 dark:border-gray-700">
    This literature review was generated with AI assistance and curated for accuracy. Citations within the full text should be verified against the primary literature.
  </div>`;
});
</script>
</body>
</html>
