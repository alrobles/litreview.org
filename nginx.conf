# Included inside http{} by the main nginx.conf — server block only.
server {
    listen 80;
    server_name _;
    root /srv/litreview;

    # do not buffer or drop large review bodies
    client_max_body_size 2m;

    index index.html;

    # public submission API -> FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # admin page served by FastAPI (token-gated)
    location = /admin.html {
        proxy_pass http://127.0.0.1:8000/admin.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # everything else static from the bind-mounted repo
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}