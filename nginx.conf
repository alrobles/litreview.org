# Included inside http{} by the main nginx.conf — server block only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cloudflare edge caches static assets aggressively; keep content fresh
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
