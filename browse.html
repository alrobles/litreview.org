<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse — LitReview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.tailwindcss.com" rel="stylesheet">
<script>
function applyTheme(){const d=localStorage.theme==='dark'||(!('theme'in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);}
applyTheme();
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.theme=document.documentElement.classList.contains('dark')?'dark':'light';}
</script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#0a0a0a] dark:text-gray-100 min-h-screen flex flex-col">

<nav class="flex justify-between items-center px-8 py-4 bg-white dark:bg-[#141414] border-b border-gray-200 dark:border-gray-800">
  <a href="/" class="font-bold text-xl"><span style="color:var(--primary)">Lit</span>Review</a>
  <div class="flex gap-6 items-center text-sm">
    <a href="/browse.html" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">Browse</a>
    <a href="/about.html" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">About</a>
    <button onclick="toggleTheme()" class="px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-800 hover:scale-110 transition-transform">🌓</button>
  </div>
</nav>

<main class="flex-1 w-full max-w-5xl mx-auto px-8 py-12">
  <h1 class="text-3xl font-bold mb-2">Browse reviews</h1>
  <p class="text-gray-500 dark:text-gray-400 mb-8">AI-generated literature reviews by scientific area.</p>

  <div id="area-filters" class="flex flex-wrap gap-2 mb-10"></div>

  <div id="listing-count" class="text-sm text-gray-400 mb-4"></div>
  <div id="listings" class="space-y-4"></div>
</main>

<footer class="px-8 py-8 text-center text-sm text-gray-500 border-t border-gray-200 dark:border-gray-800">
  LitReview © 2026 · AI-generated content is provided with curation but without warranty
</footer>

<script>
let REVIEWS=[],AREAS=[];
fetch('/data/reviews.json').then(r=>r.json()).then(data=>{
  REVIEWS=data.reviews; AREAS=data.areas;
  renderFilters(); renderList('all');
});
function areaName(id){const a=AREAS.find(a=>a.id===id);return a?a.name:id;}
function renderFilters(){
  const box=document.getElementById('area-filters');
  const mk=(id,label,active,disabled)=>{
    const b=document.createElement('button');
    b.textContent=label;
    b.className='px-4 py-2 rounded-full text-sm font-medium border transition '+
      (active?'bg-emerald-600 text-white border-emerald-600':
       disabled?'border-dashed border-gray-300 dark:border-gray-700 text-gray-400 cursor-not-allowed':
       'border-gray-300 dark:border-gray-700 hover:border-emerald-600');
    if(disabled){b.title='Coming soon';}
    else b.onclick=()=>renderList(id);
    box.appendChild(b);
  };
  mk('all','All areas',true,false);
  AREAS.forEach(a=>mk(a.id,a.name+(a.status==='coming-soon'?' (soon)':''),false,a.status==='coming-soon'));
}
function renderList(area){
  const list=document.getElementById('listings');
  const shown=area==='all'?REVIEWS:REVIEWS.filter(r=>r.area===area);
  document.getElementById('listing-count').textContent=`${shown.length} review${shown.length===1?'':'s'}`;
  list.innerHTML='';
  shown.forEach(r=>{
    const a=document.createElement('a');
    a.href=`/abs.html?id=${r.id}`;
    a.className='block p-5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#141414] hover:border-emerald-600 transition';
    a.innerHTML=`
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-xs text-gray-400 font-mono mb-1">${r.id} <span class="ml-2 not-italic">[${r.date}]</span></div>
          <div class="font-semibold text-lg">${r.title}</div>
          <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">${r.authors.join(', ')}</div>
          <p class="text-sm mt-2 line-clamp-2 text-gray-600 dark:text-gray-300">${r.abstract.slice(0,220)}…</p>
        </div>
        <span class="shrink-0 text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300">${areaName(r.area)}</span>
      </div>`;
    list.appendChild(a);
  });
}
</script>
</body>
</html>
