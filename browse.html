<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse — LitReview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse expert-written, AI-assisted literature reviews by scientific area.">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand"><span>Lit</span>Review</a>
  <div class="nav-links">
    <a href="/browse.html" class="active">Browse</a>
    <a href="/submit.html">Submit</a>
    <a href="/about.html">About</a>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>
  </div>
</nav>

<main class="container">
  <h1 class="page-title">Browse reviews</h1>
  <p class="subtitle">Expert-written, AI-assisted literature reviews, organized by scientific area.</p>

  <div id="area-filters" class="stack" style="flex-direction:row; flex-wrap:wrap; gap:.5rem; margin-bottom:2rem"></div>

  <p class="count-line" id="listing-count"></p>
  <div id="listings" class="stack"></div>
</main>

<footer class="footer">
  LitReview © 2026 · Expert-written literature reviews, AI-assisted
</footer>

<script src="/static/js/common.js"></script>
<script>
let REVIEWS = [], AREAS = [];
loadData().then(function (data) {
  REVIEWS = data.reviews.filter(function (r) { return r.status !== 'hidden'; });
  AREAS = data.areas.filter(function (a) { return a.status === 'active'; });
  renderFilters(data.areas);
  renderList('all');
});

function renderFilters(allAreas) {
  const box = document.getElementById('area-filters');
  const mk = function (id, label, active, disabled) {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = 'btn btn-sm ' + (active ? 'btn-primary' : 'btn-outline');
    if (disabled) {
      b.disabled = true; b.title = 'Coming soon'; b.style.opacity = '.5';
    } else {
      b.onclick = function () {
        box.querySelectorAll('button').forEach(function (x) {
          if (x.disabled) return;
          x.classList.remove('btn-primary'); x.classList.add('btn-outline');
        });
        b.classList.remove('btn-outline'); b.classList.add('btn-primary');
        renderList(id);
      };
    }
    box.appendChild(b);
  };
  mk('all', 'All areas', true, false);
  AREAS.forEach(function (a) { mk(a.id, a.name, false, false); });
  (allAreas || []).filter(function (a) { return a.status === 'coming-soon'; }).forEach(function (a) {
    mk(a.id, a.name + ' (soon)', false, true);
  });
}
function renderList(area) {
  const shown = area === 'all' ? REVIEWS : REVIEWS.filter(function (r) { return r.area === area; });
  document.getElementById('listing-count').textContent = shown.length + ' review' + (shown.length === 1 ? '' : 's');
  const list = document.getElementById('listings');
  list.innerHTML = '';
  shown.forEach(function (r) {
    const a = document.createElement('a');
    a.href = '/abs.html?id=' + encodeURIComponent(r.id);
    a.className = 'card';
    a.innerHTML =
      '<div class="row-between">' +
        '<div>' +
          '<div class="id-line">' + escapeHtml(r.id) + ' <span class="faint">[' + escapeHtml(r.date) + ']</span></div>' +
          '<div class="title">' + escapeHtml(r.title) + '</div>' +
          '<div class="auth">' + escapeHtml(r.authors.join(', ')) + '</div>' +
          '<p class="abs">' + escapeHtml(r.abstract.slice(0, 220)) + (r.abstract.length > 220 ? '…' : '') + '</p>' +
        '</div>' +
        '<span class="pill pill-area">' + escapeHtml(areaName(AREAS, r.area)) + '</span>' +
      '</div>';
    list.appendChild(a);
  });
}
</script>
</body>
</html>
